<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">
<title>服务器控制面板</title>
<meta name="description" content="Linux 服务器监控与 DSH 远程控制面板">
<meta name="application-name" content="服务器控制面板">
<meta name="apple-mobile-web-app-title" content="面板">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f81f7'/%3E%3Cpath d='M9 20h4v-6H9zm6 0h4V9h-4zm6 0h3v-4h-3z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="login-view" class="login-view hidden">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">
        <svg viewBox="0 0 32 32" width="40" height="40" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="url(#lg)"/>
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0" stop-color="#2f81f7"/>
              <stop offset="1" stop-color="#39c5cf"/>
            </linearGradient>
          </defs>
          <path d="M9 21h4v-7H9zm6 0h4V9h-4zm6 0h3v-5h-3z" fill="#fff"/>
        </svg>
      </div>
      <h1>服务器控制面板</h1>
      <p class="muted" id="login-host">正在连接…</p>
    </div>
    <form id="login-form" autocomplete="on">
      <label class="field">
        <span>用户名</span>
        <input type="text" id="login-username" autocomplete="username" placeholder="admin" required>
      </label>
      <label class="field">
        <span>密码</span>
        <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <label class="remember-row" for="login-remember">
        <input type="checkbox" id="login-remember" checked>
        <span>记住我（30 天免登录）</span>
      </label>
      <div id="login-error" class="form-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">登 录</button>
    </form>
    <p class="login-foot muted">首次启动的密码见服务端控制台输出</p>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="app-view" class="app hidden">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="url(#lg2)"/>
          <defs>
            <linearGradient id="lg2" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0" stop-color="#2f81f7"/>
              <stop offset="1" stop-color="#39c5cf"/>
            </linearGradient>
          </defs>
          <path d="M9 21h4v-7H9zm6 0h4V9h-4zm6 0h3v-5h-3z" fill="#fff"/>
        </svg>
        <span class="brand-name">控制面板</span>
      </div>
      <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="关闭菜单">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>

    <nav class="nav" id="nav" aria-label="主导航"></nav>

    <div class="sidebar-foot">
      <button class="install-sidebar hidden" id="install-btn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/>
        </svg>
        <span>安装到桌面</span>
      </button>
      <div class="user-box">
        <div class="avatar" id="user-avatar">A</div>
        <div class="user-meta">
          <div class="user-name" id="user-name">admin</div>
          <div class="user-role">管理员</div>
        </div>
        <button class="icon-btn" id="logout-btn" title="退出登录" aria-label="退出登录">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <h2 class="page-title" id="page-title">概览</h2>
      <div class="topbar-right">
        <span class="host-chip" id="host-chip">
          <span class="dot live"></span><span id="host-name">主机</span>
        </span>
        <button class="icon-btn" id="theme-btn" title="切换主题" aria-label="切换主题">
          <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <button class="icon-btn" id="refresh-btn" title="立即刷新" aria-label="立即刷新">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="conn-banner hidden" id="conn-banner">
      <span class="dot warn"></span> 实时连接已断开，正在重连…
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-wrap hidden" id="pwd-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>修改密码</h3>
      <button class="icon-btn" id="pwd-cancel-x" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="notice" id="pwd-notice">
        首次登录请修改默认密码。
      </div>
      <label class="field">
        <span>当前密码</span>
        <input type="password" id="pwd-current" autocomplete="current-password">
      </label>
      <label class="field">
        <span>新密码（至少 8 位）</span>
        <input type="password" id="pwd-new" autocomplete="new-password">
      </label>
      <label class="field">
        <span>确认新密码</span>
        <input type="password" id="pwd-confirm" autocomplete="new-password">
      </label>
      <div class="form-error hidden" id="pwd-error"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="pwd-cancel">取消</button>
      <button class="btn btn-primary" id="pwd-save">保存</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="/charts.js"></script>
<script src="/app.js"></script>
</body>
</html>
