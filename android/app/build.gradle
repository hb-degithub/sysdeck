plugins {
    id 'com.android.application'
}

// 签名配置从 android/keystore/keystore.properties 读取（由 scripts/build-android.sh 生成，已 gitignore）
def keystorePropsFile = rootProject.file('keystore/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'net.hbmin.serverpanel'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'net.hbmin.serverpanel'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.4.1'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file('keystore/' + (keystoreProps.getProperty('storeFile') ?: 'release.keystore'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// v1.1.0：WorkManager（小组件 15 分钟刷新 + 告警轮询）、FileProvider（更新包安装）
dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
